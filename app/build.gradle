plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.dialsender'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.dialsender'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'bin'
    }
}
